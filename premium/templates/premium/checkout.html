{% extends "base.html" %}
{% block title %}Thanh Toán Premium - CareerPath{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <h2 class="fw-bold mb-4">Bắt Đầu Dùng Thử Premium</h2>
    <p class="lead mb-4">Bạn sẽ có 14 ngày dùng thử miễn phí gói Premium để trải nghiệm các tính năng cao cấp.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">Xác nhận bắt đầu dùng thử</button>
    </form>
</div>
{% endblock %}
